name: Publish and deploy PromptForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: promptforge-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: p-jhao
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  build-and-publish:
    name: Build and publish images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/promptforge-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/promptforge-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=promptforge-backend
          cache-to: type=gha,mode=max,scope=promptforge-backend

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            BACKEND_URL=http://backend:7001
            NEXT_PUBLIC_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/promptforge-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/promptforge-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=promptforge-frontend
          cache-to: type=gha,mode=max,scope=promptforge-frontend

      - name: Build and publish Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/nginx
          file: ./deploy/nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/promptforge-nginx:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/promptforge-nginx:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=promptforge-nginx
          cache-to: type=gha,mode=max,scope=promptforge-nginx

  deploy:
    name: Deploy images to ECS
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure strict SSH credentials
        id: configure
        env:
          ECS_HOST: ${{ secrets.PROMPTFORGE_ECS_HOST }}
          ECS_USER: ${{ secrets.PROMPTFORGE_ECS_USER }}
          ECS_PORT: ${{ secrets.PROMPTFORGE_ECS_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.PROMPTFORGE_ECS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROMPTFORGE_ECS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ECS_HOST" || { echo "PROMPTFORGE_ECS_HOST is required" >&2; exit 1; }
          test -n "$ECS_USER" || { echo "PROMPTFORGE_ECS_USER is required" >&2; exit 1; }
          [[ "$ECS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "PROMPTFORGE_ECS_HOST contains unsupported characters" >&2; exit 1; }
          [[ "$ECS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "PROMPTFORGE_ECS_USER contains unsupported characters" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "PROMPTFORGE_ECS_SSH_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "PROMPTFORGE_ECS_KNOWN_HOSTS is required" >&2; exit 1; }
          ECS_PORT="${ECS_PORT:-22}"
          [[ "$ECS_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$ECS_PORT > 0 && 10#$ECS_PORT < 65536 )) || {
            echo "PROMPTFORGE_ECS_SSH_PORT must be between 1 and 65535" >&2
            exit 1
          }
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/promptforge_ssh_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/promptforge_known_hosts"
          chmod 600 "$RUNNER_TEMP/promptforge_ssh_key" "$RUNNER_TEMP/promptforge_known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/promptforge_ssh_key" >/dev/null
          KNOWN_HOST_LOOKUP="$ECS_HOST"
          if (( 10#$ECS_PORT != 22 )); then
            KNOWN_HOST_LOOKUP="[$ECS_HOST]:$ECS_PORT"
          fi
          ssh-keygen -F "$KNOWN_HOST_LOOKUP" -f "$RUNNER_TEMP/promptforge_known_hosts" >/dev/null || {
            echo "PROMPTFORGE_ECS_KNOWN_HOSTS has no entry matching PROMPTFORGE_ECS_HOST" >&2
            exit 1
          }
          {
            echo "host=$ECS_HOST"
            echo "user=$ECS_USER"
            echo "port=$ECS_PORT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload deployment script
        env:
          ECS_HOST: ${{ steps.configure.outputs.host }}
          ECS_USER: ${{ steps.configure.outputs.user }}
          ECS_PORT: ${{ steps.configure.outputs.port }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/promptforge_ssh_key" \
            -p "$ECS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$RUNNER_TEMP/promptforge_known_hosts" \
            "$ECS_USER@$ECS_HOST" 'test -d /opt/promptforge/deploy'
          scp -i "$RUNNER_TEMP/promptforge_ssh_key" \
            -P "$ECS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$RUNNER_TEMP/promptforge_known_hosts" \
            deploy/deploy-ghcr.sh \
            "$ECS_USER@$ECS_HOST:/opt/promptforge/deploy/deploy-ghcr.sh"

      - name: Deploy pinned images and verify health
        env:
          ECS_HOST: ${{ steps.configure.outputs.host }}
          ECS_USER: ${{ steps.configure.outputs.user }}
          ECS_PORT: ${{ steps.configure.outputs.port }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME" || { echo "GitHub actor name is empty" >&2; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo "GITHUB_TOKEN is empty; check workflow permissions" >&2; exit 1; }
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]{1,39}$ ]] || { echo "GitHub actor name contains unsupported characters" >&2; exit 1; }
          printf '%s\n%s\n' "$GHCR_READ_TOKEN" "$GHCR_USERNAME" | ssh \
            -i "$RUNNER_TEMP/promptforge_ssh_key" \
            -p "$ECS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$RUNNER_TEMP/promptforge_known_hosts" \
            "$ECS_USER@$ECS_HOST" \
            "bash /opt/promptforge/deploy/deploy-ghcr.sh '$IMAGE_SHA'"
